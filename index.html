<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>밤하늘의 소리 Official</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@300;400;600&display=swap">
<style>
:root{
  --bg-1: #f7f5ee;
  --text-1: #1f1f1f;
  --muted: #6b7280;
  --accent: #7b5fff;
  --glass: rgba(255,255,255,0.65);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
  background:#e6e2d8;
  color:var(--text-1);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
/* ---------- HERO ---------- */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  font-family:'Patrick Hand', cursive;
  padding:20px;
  text-align:center;
}
.hero::before{
  content:"";
  position:absolute;inset:0;
  background-image: url('/mnt/data/IMG_3292.JPG');
  background-size:cover;
  background-position:center;
  transform: scale(1.03);
  filter: saturate(0.9) contrast(1) blur(0.4px);
}
.hero::after{
  content:"";position:absolute;inset:0;
  background: linear-gradient(135deg, rgba(199,184,255,0.35), rgba(184,255,225,0.18));
  mix-blend-mode:overlay;
}
.hero-inner{
  position:relative; z-index:3; text-align:center; width:100%; max-width:1100px; padding:36px;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  transform: translateY(-10%);
}
.brand-logo{
  width:300px;
  height:300px;
  border-radius:12px;
  object-fit:cover;
  display:block;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}
.brand-sub {
  color: #ffffff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.35);
}
.hero-nav{
  display:flex;gap:14px; margin-top:10px; flex-wrap:wrap; justify-content:center;
}
.btn{
  background: rgba(58, 57, 57, 0.15);
  color:#1f1f1f;
  padding:10px 20px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.35);
  backdrop-filter: blur(10px) saturate(150%);
  cursor:pointer;
  font-weight:400;
  transition:all .22s ease;
  text-decoration:none;
}
.btn:hover{
  transform: translateY(-3px);
  background: rgba(255,255,255,0.25);
  box-shadow: 0 6px 20px rgba(0,0,0,0.12);
}
.btn.active{
  background: var(--accent);
  color:#fff;
  border-color: var(--accent);
}
/* ---------- MAIN ---------- */
main.app{
  max-width:1100px; margin: -120px auto 80px; padding:36px; position:relative; z-index:2;
}
.panel{
  background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(226, 226, 226, 0.98));
  border-radius:14px; padding:28px; box-shadow: 0 10px 40px rgba(23,23,30,0.06);
  margin-bottom:28px;
  opacity:0;
  transform: translateY(30px);
  transition: all 0.5s ease;
}
.panel.show{
  opacity:1;
  transform: translateY(0);
}
h2.section-title{ margin:0 0 10px 0; font-size:20px; letter-spacing:0.06em }
p.lead{ color:var(--muted); margin:0 0 8px 0 }
/* ---------- DISC GRID ---------- */
#discGrid {
  display:grid;
  grid-template-columns: repeat(3,1fr);
  gap:18px;
}
#galleryGrid {
  display:grid;
  grid-template-columns: repeat(3,1fr);
  gap:18px;
}
@media (max-width:980px){
  #discGrid, #galleryGrid {
    grid-template-columns: repeat(2,1fr);
  }
}
@media (max-width:599px){
  #discGrid, #galleryGrid {
    grid-template-columns: repeat(1,1fr);
  }
}
.card{ background:linear-gradient(180deg,var(--glass),rgba(255,255,255,0.85)); border-radius:12px; overflow:hidden; transition: transform .18s ease, box-shadow .18s ease; border:1px solid rgba(16,24,40,0.04);
  display:flex; flex-direction:column; align-items:stretch }
.card:hover{ transform: translateY(-6px); box-shadow:0 18px 40px rgba(18,22,30,0.08) }
.card-body{ padding:14px }
/* ---------- MODAL ---------- */
.modal-root{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:120; }
.modal-backdrop{ position:absolute; inset:0; background: rgba(10,12,20,0.45); backdrop-filter: blur(2px); }
.modal-content{ position:relative; width:100%; max-width:720px; background:#fff; border-radius:12px; overflow:hidden; transform: translateY(12px) scale(.98); opacity:0; transition: all .22s ease; box-shadow:0 30px 80px rgba(10,12,20,0.25) }
.modal-content.show{ transform:none; opacity:1 }
.modal-grid{ display:grid; grid-template-columns: 1fr 1fr }
.modal-cover{ width:100%; height:100%; object-fit:cover }
.modal-body{ padding:20px }
.modal-close{ position:absolute; top:12px; right:12px; background:transparent; border:none; font-weight:800; font-size:18px; cursor:pointer }
/* responsive... (원본 그대로) */
@media (max-width: 1024px) and (min-width: 768px) {.modal-content { max-width: 480px; }}
@media (min-width: 600px) and (max-width: 767px) {.modal-content { max-width: 420px; }}
@media (max-width: 599px) {
  .modal-content { width: 85%; max-width: 320px; transform: scale(0.92); }
  .modal-grid { grid-template-columns: 1fr; }
  .modal-cover { width:100%; height:auto; }
}
/* content grid ... 원본 그대로 */
#contentGrid { display:grid; gap:18px; grid-template-columns:repeat(3,1fr);}
@media (max-width:980px){#contentGrid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:599px){#contentGrid{grid-template-columns:repeat(1,1fr);}}
#contentGrid .card img{width:100%;display:block;object-fit:cover;}
img{-webkit-user-drag:none;user-select:none;pointer-events:auto;}
#discGrid .card img,#galleryGrid .card img,#about img{pointer-events:none;}
</style>
</head>
<body>

<header class="hero" role="banner">
  <div class="hero-inner">
    <img src="img/skylogo.png" alt="밤하늘의 소리 로고" class="brand-logo" id="brandLogo">
    <p class="brand-sub"></p>
    <nav class="hero-nav" aria-label="primary">
      <button class="btn" onclick="showSection('about', this)">About</button>
      <button class="btn" onclick="showSection('discography', this)">Discography</button>
      <button class="btn" onclick="showSection('gallery', this)">Gallery</button>
      <button class="btn" onclick="showSection('content', this)">Contents</button>
      <button class="btn" onclick="showSection('contact', this)">Contact</button>
    </nav>
  </div>
</header>

<main class="app" role="main" style="display:none;">
  <section id="about" class="panel">
    <h2 id="aboutTitle" class="section-title">History</h2>
    <p class="lead">2018년 … (원문 그대로)</p>
    <div style="display:flex;gap:18px;align-items:center;margin-top:18px;flex-wrap:wrap">
      <img src="img/pf.jpg" alt="artist" style="width:160px;height:160px;object-fit:cover;border-radius:12px;border:1px solid rgba(16,24,40,0.04)">
      <div style="flex:1;min-width:200px">
        <p>음원 제작자 · 뮤지션</p>
        <p>활동명: 밤하늘의 소리</p>
        <p>장르: 인디 / 락 / Soul</p>
      </div>
    </div>
  </section>

  <section id="discography" class="panel">
    <h2 class="section-title">Discography</h2>
    <p class="lead">아래의 작품들은 …</p>
    <div class="grid" id="discGrid"></div>
  </section>

  <section id="gallery" class="panel">
    <h2 class="section-title">Gallery</h2>
    <p class="lead">'밤하늘의 소리'의 온라인 개인전입니다.</p>
    <div class="grid" id="galleryGrid"></div>
  </section>

  <section id="content" class="panel">
    <h2 class="section-title">Contents</h2>
    <p class="lead">그림을 누르시면 …</p>
    <div id="contentGrid" class="grid" style="margin-top:18px; gap:18px;"></div>
  </section>

  <section id="contact" class="panel">
    <h2 class="section-title">E-mail</h2>
    <p class="muted">voice_of_a_night_sky@naver.com</p>
  </section>
</main>

<!-- Modal -->
<div id="modalRoot" class="modal-root" style="display:none;">
  <div class="modal-backdrop" onclick="closeModal()" aria-hidden="true"></div>
  <div id="modalContent" class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-grid">
      <div><img id="modalCover" class="modal-cover" src="" alt="Album cover"></div>
      <div class="modal-body">
        <h3 id="modalTitle"></h3>
        <p id="modalDesc" class="muted"></p>
        <audio id="modalAudio" controls preload="none" style="width:100%">
          <source id="modalAudioSrc" src="" type="audio/mpeg">
        </audio>
        <div style="margin-top:12px;">
          <a id="linkStore" class="link" href="#" target="_blank">Streaming</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/*---------------------------*/
const discs = [
  {id:1, title:'밤하늘의 소리 - Sunroof', year:2025, cover:'img/sunroof.jpg', desc:'(작사·곡, 편곡)', audio:'Music/sunroof.mp3', link:'https://youtu.be/h-2VvxUEV24'},
  {id:2, title:'밤하늘의 소리 - 비밀정원', year:2025, cover:'img/scgd.jpg', desc:'(작사·곡, 편곡)', audio:'Music/scr.mp3', link:'https://youtu.be/ykkKX2pMibE'},
  {id:3, title:'밤하늘의 소리 - Swing swing (Mixtape)', year:2024, cover:'img/swingswing.png', desc:'(작사·곡, 편곡)', audio:'Music/swingswing.mp3', link:'#'},
  {id:4, title:'퓨어뮤직 - 눈(雪) (Mixtape)', year:2023, cover:'img/snow.png', desc:'Day6 성진 Demo (편곡)', audio:'Music/snow.mp3', link:'#'},
  {id:5, title:'엄마의 자리', year:2022, cover:'img/moov.jpg', desc:'장편영화 (작·편곡)', audio:'Music/movvvvv.mp3', link:'https://www.asianpopupcinema.org/season-15-calendar/mothers-place'},
  {id:6, title:'사서고생', year:2022, cover:'img/ssgsms.jpg', desc:'네이버 웹툰 (작·편곡)', audio:'Music/msmsmsm ssgs.mp3', link:'https://m.comic.naver.com/...'},
  {id:7, title:'김광석 - 바람이 불어오는 곳', year:2024, cover:'img/babu.jpg', desc:'노무현 대통령…', audio:'Music/windy.mp3', link:'https://www.youtube.com/watch?v=vpQVuUOxd7g'},
  {id:8, title:'나의 연애코치', year:2025, cover:'img/nyc.jpg', desc:'뮤지컬 (편곡)', audio:'#', link:'https://youtube.com/...'},
  {id:9, title:'나는 제주로 출근한다', year:2022, cover:'img/njj.png', desc:'Jeju MBC 예능', audio:'Music/bababababnzmzbmbm.mp3', link:'https://www.youtube.com/...'},
  {id:10, title:'Kkoj - O$D', year:2020, cover:'img/freestyle.jpeg', desc:'Freestyle OST', audio:'Music/kkojond.mp3', link:'https://fs2.joycity.com/...'},
  {id:11, title:'Kkoj - Ga', year:2020, cover:'img/ga.jpeg', desc:'(편곡·프로듀싱)', audio:'Music/kkojga.mp3', link:'https://www.youtube.com/...'},
  {id:12, title:'Chan2 - Feeling Alright', year:2020, cover:'img/feelingalright.jpeg', desc:'(편곡·프로듀싱)', audio:'Music/feelingalright.mp3', link:'https://www.youtube.com/...'},
  {id:13, title:'시그음치 Album', year:2023, cover:'img/sgmc.jpeg', desc:'(작·편곡)', audio:'#', link:'https://www.youtube.com/...'},
  {id:14, title:'퍼플키스 - 전선을 간다', year:2022, cover:'img/warpath.jpg', desc:'광고음악 (편곡)', audio:'#', link:'https://www.youtube.com/...'},
];

const galleryItem = [
  {id:1, title:'덧니', year:2025, cover:'img/dutni.jpg', desc:'', audio:'#', link:'https://www.instagram.com/...'},
  {id:2, title:'조망 효과', year:2025, cover:'img/thumb.jpg', desc:'', audio:'#', link:'#'},
];

const discGrid = document.getElementById('discGrid');
const galleryGrid = document.getElementById('galleryGrid');

/* 카드 생성 */
function createCard(d){
  const el = document.createElement('article');
  el.className = 'card';
  el.innerHTML = `
    <img class="card-media" src="${d.cover}" alt="">
    <div class="card-body">
      <div class="meta">${d.year}</div>
      <h4 class="title">${d.title}</h4>
      <p class="muted" style="margin:0 0 12px 0;">${d.desc}</p>
      <div class="cta-row">
        <button class="small-btn primary">자세히 보기</button>
      </div>
    </div>
  `;
  el.querySelector('button').addEventListener('click', ()=> openModal(d));
  return el;
}
discs.forEach(d => discGrid.appendChild(createCard(d)));

function createGalleryCard(d){
  const el = document.createElement('article');
  el.className='card';
  el.innerHTML = `
    <img class="card-media" src="${d.cover}" alt="">
    <div class="card-body">
      <div class="meta">${d.year}</div>
      <h4 class="title">${d.title}</h4>
      <p class="muted">${d.desc}</p>
    </div>
  `;
  return el;
}
galleryItem.forEach(d=> galleryGrid.appendChild(createGalleryCard(d)));

/* Section */
function showSection(id, btn){
  const main = document.querySelector('main.app');
  if (!main) return;
  main.style.display = 'block';

  main.querySelectorAll('section').forEach(sec=>{
    sec.style.display = sec.id === id ? 'block' : 'none';
    sec.classList.toggle('show', sec.id===id);
  });

  document.querySelectorAll('.hero-nav .btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');

  const target = document.getElementById(id);
  if(target) target.scrollIntoView({behavior:'smooth'});
}

/* Modal */
const modalRoot = document.getElementById('modalRoot');
const modalContent = document.getElementById('modalContent');
const modalCover = document.getElementById('modalCover');
const modalTitle = document.getElementById('modalTitle');
const modalDesc = document.getElementById('modalDesc');
const modalAudioSrc = document.getElementById('modalAudioSrc');
const modalAudio = document.getElementById('modalAudio');
const linkStore = document.getElementById('linkStore');

function openModal(d){
  if(!modalRoot) return;
  modalRoot.style.display='flex';
  modalCover.src = d.cover;
  modalTitle.textContent = d.title + " — " + d.year;
  modalDesc.textContent = d.desc;
  modalAudioSrc.src = d.audio || '';
  try { modalAudio.load(); } catch(e){}
  linkStore.href = d.link || '#';
  modalContent.classList.add('show');
  document.body.style.overflow='hidden';
}
function closeModal(){
  modalContent.classList.remove('show');
  setTimeout(()=> modalRoot.style.display='none', 200);
  try{ modalAudio.pause(); modalAudio.currentTime=0; }catch(e){}
  document.body.style.overflow='';
}
window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

/* 콘텐츠 그리드 */
const contentItems = [
  {id:1, img:'img/le.png', link:'https://forms.gle/XtUqVKc1MyLHSdUi6'},
  {id:2, img:'img/youtube02.jpg', link:'https://www.youtube.com/@Voice_of_a_night_sky'}
];
const contentGrid = document.getElementById('contentGrid');
contentItems.forEach(item=>{
  const card = document.createElement('article');
  card.className='card';
  card.innerHTML = `<a href="${item.link}" target="_blank"><img src="${item.img}" class="card-media"></a>`;
  contentGrid.appendChild(card);
});

/* 이미지 저장 방지 */
document.addEventListener('contextmenu', function(e){
  if(e.target.tagName === 'IMG' && !e.target.closest('a')){
    e.preventDefault();
    alert('이미지는 복사/저장이 불가합니다.');
  }
});

/* 첫 화면 */
let initialized = false;
document.addEventListener('DOMContentLoaded', function(){
  if(initialized) return;
  initialized = true;
  showSection('about', document.querySelector('.hero-nav .btn'));
});
</script>

</body>
</html>
